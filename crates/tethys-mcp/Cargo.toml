[package]
name = "tethys-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server companion binary — lets a Claude session hand work off to a new Tethys workspace"

[lib]
name = "tethys_mcp"
path = "src/lib.rs"

[[bin]]
name = "tethys-mcp"
path = "src/main.rs"
# The app depends on this crate for the wire format only. Gating the binary
# keeps the MCP protocol stack out of the Tethys build.
required-features = ["server"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

rmcp = { version = "3", default-features = false, features = ["server", "transport-io"], optional = true }
anyhow = { version = "1", optional = true }

[features]
default = ["server"]
server = ["dep:rmcp", "dep:anyhow", "tokio/io-std"]
